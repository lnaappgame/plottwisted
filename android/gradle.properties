org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Charte LNA App v1.5 : démons partagés, arrêt automatique après 5 min (jamais de gradlew --stop).
org.gradle.daemon.idletimeout=300000
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Plugins come from the pub cache on another drive (J:): Kotlin's incremental
# caches break across drive roots on Windows ("Storage ... is already registered").
kotlin.incremental=false
